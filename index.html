<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Congratulations — Presented by Goodwall</title>
  <meta name="description" content="Congratulations! Download your voucher presented by Goodwall." />
  <link rel="icon" href="favicon.ico" />
  <style>
    :root{
      --bg-1: #fff3c4;
      --bg-2: #ffd966;
      --card-bg: #ffffff;
      --text: #3b2f1c;
      --accent: #b8860b;
      --muted: #6b5a3a;
      --shadow: rgba(0,0,0,0.12);
      --radius: 16px;
      --gap: 18px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--text);
      background: linear-gradient(135deg,var(--bg-1),var(--bg-2));
      -webkit-font-smoothing:antialiased;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .container{
      width:100%;
      max-width:520px;
      background:var(--card-bg);
      border-radius:var(--radius);
      padding:28px;
      box-shadow:0 12px 30px var(--shadow);
      text-align:center;
    }

    h1{
      margin:0 0 12px;
      font-size:1.9rem;
      color:var(--accent);
      line-height:1.1;
    }

    figure{
      margin:0 0 var(--gap);
    }

    .voucher-image{
      width:100%;
      max-width:460px;
      border-radius:12px;
      display:block;
      margin:0 auto;
      object-fit:cover;
      border:1px solid #eaeaea;
    }

    .presented-by{
      margin-top:10px;
      font-size:.95rem;
      color:var(--muted);
      letter-spacing:.3px;
    }

    .actions{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:18px;
      flex-wrap:wrap;
    }

    .btn{
      background:var(--accent);
      color:white;
      text-decoration:none;
      padding:10px 16px;
      border-radius:10px;
      font-weight:600;
      box-shadow:0 6px 18px rgba(184,134,11,0.18);
    }

    .btn:focus, .btn-outline:focus{
      outline:3px solid rgba(184,134,11,0.18);
      outline-offset:3px;
    }

    .btn-outline{
      background:transparent;
      color:var(--text);
      border:1px solid #ddd;
      padding:10px 16px;
      border-radius:10px;
    }

    @media (max-width:420px){
      .container{padding:20px}
      h1{font-size:1.5rem}
    }

    @media print{
      body{background:white}
      .container{box-shadow:none;border-radius:0}
      .actions{display:none}
    }

    @media (prefers-reduced-motion:reduce){
      *{transition:none!important}
    }
  </style>
</head>
<body>
  <main class="container" role="main" aria-labelledby="congrats-heading">
    <h1 id="congrats-heading">🎉 Congratulations 🎉</h1>

    <figure>
      <picture>
        <!-- Provide a webp fallback for smaller downloads when available -->
        <source srcset="voucher.webp" type="image/webp" />
        <!-- Provide a meaningful alt describing the voucher -->
        <img
          src="voucher.jpg"
          alt="Voucher certificate for a prize presented by Goodwall"
          class="voucher-image"
          loading="lazy"
          width="1200"
          height="800"
        />
      </picture>
      <figcaption class="presented-by">Presented by <strong>Goodwall</strong></figcaption>
    </figure>

    <div class="actions" role="region" aria-label="Voucher actions">
      <!-- direct download of the image; replace href if you store image in a different path -->
      <a class="btn" href="voucher.jpg" download="goodwall-voucher.jpg">Download voucher</a>
      <button class="btn-outline" type="button" onclick="window.print()">Print</button>
    </div>
  </main>
</body>
</html>
